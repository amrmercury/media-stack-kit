name: test
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: node tests/test_ui_logic.js
      - run: python3 tests/test_webui.py
      - run: python3 tests/test_bazarr_form.py
      - run: python3 -m py_compile lib/*.py tools/*.py
      - run: bash -n install.sh && bash -n stack.sh && bash -n diag.sh && bash -n uninstall.sh
      - run: shellcheck -S warning install.sh stack.sh diag.sh uninstall.sh tests/ci_diag.sh || true

  install:
    name: full install (${{ matrix.case }})
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case: [basic, full]
    steps:
      - uses: actions/checkout@v4
      - name: Fake answers
        run: python3 tests/ci_answers.py ${{ matrix.case }} "$RUNNER_TEMP/answers.json"
      - name: Install, first run (clean machine)
        shell: bash
        run: ./install.sh --answers "$RUNNER_TEMP/answers.json" --state-dir "$RUNNER_TEMP/state" 2>&1 | tee "$RUNNER_TEMP/run1.log"
      - name: Install again (must be safe and change nothing)
        shell: bash
        run: ./install.sh --answers "$RUNNER_TEMP/answers.json" --state-dir "$RUNNER_TEMP/state" 2>&1 | tee "$RUNNER_TEMP/run2.log"
      - name: Take everything down, then install again (the restart / dead-mount case)
        shell: bash
        run: |
          export STACK_STATE_DIR="$RUNNER_TEMP/state"
          ./stack.sh down
          ./install.sh --answers "$RUNNER_TEMP/answers.json" --state-dir "$RUNNER_TEMP/state" 2>&1 | tee "$RUNNER_TEMP/run3.log"
      - name: Remove everything (including root-owned leftovers), check nothing is left, then install once more
        shell: bash
        run: |
          export STACK_STATE_DIR="$RUNNER_TEMP/state"
          sudo mkdir -p "$HOME/media-stack/jellyfin/config/data" && sudo touch "$HOME/media-stack/jellyfin/config/data/root-owned.db"
          ./uninstall.sh --yes 2>&1 | tee "$RUNNER_TEMP/uninstall.log"
          fail=0
          for p in "$HOME/media-stack" "$HOME/ci-media/decypharr" "$HOME/ci-media/symlinks" "$HOME/ci-cache/media-stack-cache" "$STACK_STATE_DIR"; do
            [ -e "$p" ] && { echo "LEFTOVER: $p"; fail=1; }
          done
          docker ps -a --format '{{.Names}}' | grep -x -E 'decypharr|prowlarr|sonarr|radarr|bazarr|flaresolverr|jellyseerr|jellyfin|recyclarr|pearlarr|homepage|babysitarr|arabarr' && { echo "LEFTOVER containers"; fail=1; }
          grep -q "ci-media/decypharr" /proc/mounts && { echo "LEFTOVER mount"; fail=1; }
          [ "$fail" = 0 ] || exit 1
          echo "nothing left; installing from scratch"
          ./install.sh --answers "$RUNNER_TEMP/answers.json" --state-dir "$RUNNER_TEMP/state" 2>&1 | tee "$RUNNER_TEMP/run4.log"
      - name: Resource use
        if: always()
        run: docker stats --no-stream || true
      - name: The --diag command works and covers what it should
        shell: bash
        run: |
          STACK_STATE_DIR="$RUNNER_TEMP/state" ./install.sh --diag > "$RUNNER_TEMP/diag-out.txt"
          for h in "== kit" "== system" "== memory and disk" "== last 80 lines of the install log" "== containers" "== answers (no secrets)"; do
            grep -q "$h" "$RUNNER_TEMP/diag-out.txt" || { echo "diag output is missing: $h"; exit 1; }
          done
          ! grep -q -E "FAKE[A-Z0-9]{8}" "$RUNNER_TEMP/diag-out.txt" || { echo "diag leaked a key"; exit 1; }
          head -25 "$RUNNER_TEMP/diag-out.txt"
      - name: Collect diagnostics
        if: always()
        run: bash tests/ci_diag.sh diag "$RUNNER_TEMP/state"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-install-${{ matrix.case }}
          path: diag
          retention-days: 7

  web-ui:
    name: installer page, real browser, real install
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Click through the page and install
        shell: bash
        run: python3 tests/e2e_web.py --state-dir "$RUNNER_TEMP/state-ui" --shots shots
      - name: Collect diagnostics
        if: always()
        run: bash tests/ci_diag.sh diag "$RUNNER_TEMP/state-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-ui
          path: |
            shots
            diag
          retention-days: 7
