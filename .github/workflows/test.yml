name: test
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: node tests/test_ui_logic.js
      - run: python3 tests/test_webui.py
      - run: python3 tests/test_bazarr_form.py
      - run: python3 tests/test_jellyfin_retry.py
      - run: python3 tests/test_robust.py
      - run: python3 -m py_compile lib/*.py tools/*.py
      - run: bash -n install.sh && bash -n stack.sh && bash -n diag.sh && bash -n uninstall.sh
      - run: shellcheck -S warning install.sh stack.sh diag.sh uninstall.sh tests/ci_diag.sh || true

  install:
    name: full install (${{ matrix.case }})
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case: [basic, full]
    steps:
      - uses: actions/checkout@v4
      - name: Fake answers
        run: python3 tests/ci_answers.py ${{ matrix.case }} "$RUNNER_TEMP/answers.json"
      - name: Install, first run (clean machine)
        shell: bash
        run: ./install.sh --answers "$RUNNER_TEMP/answers.json" --state-dir "$RUNNER_TEMP/state" 2>&1 | tee "$RUNNER_TEMP/run1.log"
      - name: Install again (must be safe and change nothing)
        shell: bash
        run: ./install.sh --answers "$RUNNER_TEMP/answers.json" --state-dir "$RUNNER_TEMP/state" 2>&1 | tee "$RUNNER_TEMP/run2.log"
      - name: Take everything down, then install again (the restart / dead-mount case)
        shell: bash
        run: |
          export STACK_STATE_DIR="$RUNNER_TEMP/state"
          ./stack.sh down
          ./install.sh --answers "$RUNNER_TEMP/answers.json" --state-dir "$RUNNER_TEMP/state" 2>&1 | tee "$RUNNER_TEMP/run3.log"
      - name: Remove everything (including root-owned leftovers), check nothing is left, then install once more
        shell: bash
        run: |
          export STACK_STATE_DIR="$RUNNER_TEMP/state"
          sudo mkdir -p "$HOME/media-stack/jellyfin/config/data" && sudo touch "$HOME/media-stack/jellyfin/config/data/root-owned.db"
          mkdir -p "$HOME/ci-media/Movies/Test" && echo "test media" > "$HOME/ci-media/Movies/Test/film.mkv"     # the user's own test media
          ./uninstall.sh --yes 2>&1 | tee "$RUNNER_TEMP/uninstall.log"
          [ -f "$HOME/ci-media/Movies/Test/film.mkv" ] || { echo "plain uninstall must NOT delete the user's media"; exit 1; }
          ./install.sh --answers "$RUNNER_TEMP/answers.json" --state-dir "$RUNNER_TEMP/state" > /dev/null 2>&1 || true     # put the stack back
          ./uninstall.sh --yes --everything 2>&1 | tee "$RUNNER_TEMP/uninstall2.log"
          fail=0
          [ -e "$HOME/ci-media" ] && { echo "LEFTOVER: the library folder survived --everything"; fail=1; }
          for p in "$HOME/media-stack" "$HOME/ci-media/decypharr" "$HOME/ci-media/symlinks" "$HOME/ci-cache/media-stack-cache" "$STACK_STATE_DIR"; do
            [ -e "$p" ] && { echo "LEFTOVER: $p"; fail=1; }
          done
          docker ps -a --format '{{.Names}}' | grep -x -E 'decypharr|prowlarr|sonarr|radarr|bazarr|flaresolverr|jellyseerr|jellyfin|recyclarr|pearlarr|homepage|babysitarr|arabarr' && { echo "LEFTOVER containers"; fail=1; }
          grep -q "ci-media/decypharr" /proc/mounts && { echo "LEFTOVER mount"; fail=1; }
          [ "$fail" = 0 ] || exit 1
          echo "nothing left; installing from scratch"
          ./install.sh --answers "$RUNNER_TEMP/answers.json" --state-dir "$RUNNER_TEMP/state" 2>&1 | tee "$RUNNER_TEMP/run4.log"
      - name: Resource use
        if: always()
        run: docker stats --no-stream || true
      - name: The --diag command works and covers what it should
        shell: bash
        run: |
          STACK_STATE_DIR="$RUNNER_TEMP/state" ./install.sh --diag > "$RUNNER_TEMP/diag-out.txt"
          for h in "== kit" "== system" "== memory and disk" "== last 80 lines of the install log" "== containers" "== answers (no secrets)"; do
            grep -q "$h" "$RUNNER_TEMP/diag-out.txt" || { echo "diag output is missing: $h"; exit 1; }
          done
          ! grep -q -E "FAKE[A-Z0-9]{8}" "$RUNNER_TEMP/diag-out.txt" || { echo "diag leaked a key"; exit 1; }
          head -25 "$RUNNER_TEMP/diag-out.txt"
      - name: Collect diagnostics
        if: always()
        run: bash tests/ci_diag.sh diag "$RUNNER_TEMP/state"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-install-${{ matrix.case }}
          path: diag
          retention-days: 7

  stress:
    name: slow busy machine, apps restarting (seed ${{ matrix.seed }})
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: Fake answers (full)
        run: python3 tests/ci_answers.py full "$RUNNER_TEMP/answers.json"
      - name: Slow the machine down (CPU + memory pressure) and keep restarting apps while installing
        shell: bash
        run: |
          sudo apt-get install -y -qq stress-ng >/dev/null
          nohup stress-ng --cpu 2 --cpu-load 85 --vm 1 --vm-bytes 1800M --vm-keep --timeout 3000s >/dev/null 2>&1 &
          rm -f "$RUNNER_TEMP/chaos.stop"
          CHAOS_SEED=${{ matrix.seed }} nohup bash tests/ci_chaos.sh "$RUNNER_TEMP/chaos.stop" "$RUNNER_TEMP/chaos.log" >/dev/null 2>&1 &
          set +e
          ./install.sh --answers "$RUNNER_TEMP/answers.json" --state-dir "$RUNNER_TEMP/state" 2>&1 | tee "$RUNNER_TEMP/stress-run.log"
          code=${PIPESTATUS[0]}
          touch "$RUNNER_TEMP/chaos.stop"; sleep 25; cat "$RUNNER_TEMP/chaos.log"
          exit $code
      - name: Install again with nothing disturbing it (must be a clean no-op)
        run: ./install.sh --answers "$RUNNER_TEMP/answers.json" --state-dir "$RUNNER_TEMP/state" 2>&1 | tail -30
      - name: Collect diagnostics
        if: always()
        run: bash tests/ci_diag.sh diag "$RUNNER_TEMP/state"; cp "$RUNNER_TEMP/chaos.log" diag/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-stress-${{ matrix.seed }}
          path: diag

  resume:
    name: installer killed at every stage, then re-run
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Fake answers (full)
        run: python3 tests/ci_answers.py full "$RUNNER_TEMP/answers.json"
      - name: Kill the installer at each stage, re-run each time, finish with a verified install
        shell: bash
        run: bash tests/ci_resume.sh "$RUNNER_TEMP/answers.json" "$RUNNER_TEMP/state"
      - name: Collect diagnostics
        if: always()
        run: bash tests/ci_diag.sh diag "$RUNNER_TEMP/state"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-resume
          path: diag

  pythons:
    name: kit code on Python ${{ matrix.py }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py: ["3.8", "3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - run: python -m py_compile lib/*.py tools/*.py
      - run: python tests/test_webui.py
      - run: python tests/test_bazarr_form.py
      - run: python tests/test_jellyfin_retry.py
      - run: python tests/test_robust.py

  distros:
    name: prerequisites + kit tests on ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12", "fedora:41", "archlinux:latest", "opensuse/tumbleweed:latest"]
    steps:
      - uses: actions/checkout@v4
      - name: "Fresh distro container, normal user: the installer must set up its own tools"
        run: |
          docker run --rm -v "$PWD:/kit:ro" "${{ matrix.image }}" bash -c '
            set -e
            if command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y -qq sudo >/dev/null
            elif command -v dnf >/dev/null; then dnf install -y -q sudo shadow-utils util-linux >/dev/null
            elif command -v pacman >/dev/null; then pacman -Sy --noconfirm sudo >/dev/null
            elif command -v zypper >/dev/null; then zypper --non-interactive install sudo shadow >/dev/null; fi
            useradd -m tester; echo "tester ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/tester
            cp -r /kit /home/tester/kit; chown -R tester /home/tester/kit
            su tester -c "cd ~/kit && STACK_PREREQS_ONLY=1 ./install.sh && python3 -m py_compile lib/*.py && python3 tests/test_webui.py && python3 tests/test_robust.py && python3 tests/test_jellyfin_retry.py"'

  nodocker:
    name: install on a computer with no Docker at all
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Remove Docker completely (and its group), like a friend's PC
        shell: bash
        run: |
          sudo systemctl stop docker docker.socket containerd 2>/dev/null || true
          sudo apt-get purge -y -qq docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin docker.io podman-docker moby-engine moby-cli moby-buildx moby-compose 2>/dev/null || true
          sudo rm -rf /var/lib/docker /var/lib/containerd /etc/docker "$HOME/.docker"
          sudo rm -f /usr/bin/docker /usr/local/bin/docker /usr/local/bin/docker-compose /var/run/docker.sock
          sudo groupdel docker 2>/dev/null || true
          hash -r
          ! command -v docker || { echo "docker is still installed"; exit 1; }
      - name: Fake answers
        run: python3 tests/ci_answers.py basic "$RUNNER_TEMP/answers.json"
      - name: Install (must install Docker itself, get the docker group, and finish)
        shell: bash
        run: ./install.sh --answers "$RUNNER_TEMP/answers.json" --state-dir "$RUNNER_TEMP/state" 2>&1 | tee "$RUNNER_TEMP/run.log"
      - name: Collect diagnostics
        if: always()
        run: bash tests/ci_diag.sh diag "$RUNNER_TEMP/state"; cp "$RUNNER_TEMP/run.log" diag/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-nodocker
          path: diag

  web-ui:
    name: installer page, real browser, real install
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Click through the page and install
        shell: bash
        run: python3 tests/e2e_web.py --state-dir "$RUNNER_TEMP/state-ui" --shots shots
      - name: Collect diagnostics
        if: always()
        run: bash tests/ci_diag.sh diag "$RUNNER_TEMP/state-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-ui
          path: |
            shots
            diag
          retention-days: 7
